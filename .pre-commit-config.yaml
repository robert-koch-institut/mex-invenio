fail_fast: false
repos:
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.15.16
    hooks:
      - id: ruff-check
        name: ruff-check
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        name: ruff-format
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v6.0.0
    hooks:
      - id: pretty-format-json
        name: json
        args: [--autofix, --indent=4, --no-ensure-ascii]
        exclude: .cruft.json
      - id: check-yaml
        name: yaml
        exclude: templates\/[a-z_-]+.yaml
      - id: end-of-file-fixer
        name: eof
      - id: trailing-whitespace
        name: whitespaces
      - id: fix-byte-order-marker
        name: byte-order
  - repo: local
    hooks:
    - id: pipenv-check
      name: pipenv
      entry: pipenv verify
      files: ^Pipfile[\.lock]?$
      language: system
      pass_filenames: false
  - repo: local
    hooks:
    - id: mypy
      name: mypy
      entry: pipenv run dmypy run --timeout 7200 -- site tests
      files: ^(site|tests)/|pyproject\.toml$
      language: system
      pass_filenames: false
      types: [python]
