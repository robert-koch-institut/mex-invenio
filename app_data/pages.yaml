# Each page is loaded once per language (invenio rdm pages create): <template>.<lang>
# if it exists, otherwise <template>, which holds the German (default locale)
# version. Titles are message IDs, translated in translations/*/LC_MESSAGES/ui.po.
- url: /about
  title: aboutPageTitle
  template: about.html
- url: /contact
  title: contactPageTitle
  template: contact.html
- url: /data-privacy
  title: dataPrivacyPageTitle
  template: dataprivacy.html
- url: /accessibility
  title: accessibilityPageTitle
  template: accessibility.html
- url: /imprint
  title: imprintPageTitle
  template: imprint.html
