<div id="missing_values_checkbox_wrapper">
    <label for="show_missing_values" class="checkbox checkbox--missing-value" style="">
        <input type="checkbox" class="ui checkbox" id="show_missing_values">
        {{ _("showMissingValues") }}</label>
    </label>
    <details class="muted" id="details-trigger">
        <summary>{{ _("missingValuesHelpTrigger") }}</summary>
        <p>{{ _("missingValuesHelp") }}</p></details>
</div>
<script>
    document.addEventListener("DOMContentLoaded", function () {
        const detailsTrigger = document.getElementById("details-trigger");
        const ids = document.getElementById("record-ids")
        if (detailsTrigger.hasAttribute("open")) {
            ids.classList.add("open");
        }

        detailsTrigger.addEventListener("click", () => {
            ids.classList.toggle("lower")
        })
    });

    const checkbox = document.getElementById("show_missing_values");
    const record = document.getElementById("landing_page");

    // Restore preference
    const showMissing = localStorage.getItem("showMissingData") === "true";

    if (showMissing) {
        record.classList.add("show-missing-data");
        checkbox.checked = true;
    }

    checkbox.addEventListener("change", () => {
        record.classList.toggle(
            "show-missing-data",
            checkbox.checked
        );

        localStorage.setItem(
            "showMissingData",
            checkbox.checked
        );
    });
</script>
